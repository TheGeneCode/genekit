[project]
name = "genekit"
version = "0.0.0"
description = "Personal cross-app shared library (Python). Admission and quality rules: ../CHARTER.md"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genekit"]

[tool.ruff]
line-length = 100
# target-version intentionally omitted: ruff infers it from requires-python (>=3.12).

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "Q", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
