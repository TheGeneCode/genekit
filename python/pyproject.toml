[project]
name = "genekit"
version = "0.2.0"
description = "Personal cross-app shared library (Python) — opinionated glue for decisions worth making once."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheGeneCode" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/TheGeneCode/genekit"
Repository = "https://github.com/TheGeneCode/genekit"
Changelog = "https://github.com/TheGeneCode/genekit/blob/main/python/CHANGELOG.md"
Charter = "https://github.com/TheGeneCode/genekit/blob/main/CHARTER.md"

[project.optional-dependencies]
rich = ["rich>=13"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff", "tomli>=2; python_version < '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genekit"]

[tool.ruff]
line-length = 100
# target-version intentionally omitted: ruff infers it from requires-python (>=3.10).

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "Q", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
